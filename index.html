<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    #background-video {
        position: fixed;
        top: 50%;
        left: 50%;

        width: 100vw;
        height: 100vh;

        transform: translate(-50%, -50%);

        object-fit: cover;

        z-index: -1;
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background: rgba(0,0,0,0.15);

        z-index: 0;
    }

    .content {
        position: relative;

        width: 100%;
        height: 100%;

        display: flex;
        justify-content: center;
        align-items: center;

        z-index: 1;
    }

</style>

</head>

<body>

<!-- BACKGROUND VIDEO -->
<video 
    id="background-video"
    autoplay
    muted
    loop
    playsinline>

    <source 
        src="https://viddler.com/N2eSrQ"
        type="video/mp4">

</video>


<!-- OPTIONAL DARK OVERLAY -->
<div class="overlay"></div>


<!-- OPTIONAL CONTENT -->
<div class="content">

</div>


<script>

const video = document.getElementById("background-video");

// Force autoplay on browsers that block it
video.play().catch(error => {
    console.log("Autoplay blocked:", error);
});

// Restart video if interrupted
video.addEventListener("ended", () => {
    video.currentTime = 0;
    video.play();
});

</script>


</body>
</html>
