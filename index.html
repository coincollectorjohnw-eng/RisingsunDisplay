<!DOCTYPE html>
<html>
<head>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

video {
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

</style>

</head>

<body>

<!-- VIDEO PLAYER -->
<video 
    id="background-video"
    autoplay
    muted
    loop
    playsinline>
</video>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyhBuSjJFQn4zrVydoku9ycRvrHB_ePhehm5s2ItLHdHoXtgRTVY9LdnXnTvNPvfkqOqQ/exec";

const video = document.getElementById("background-video");

let retryCount = 0;
const MAX_RETRIES = 5;

async function loadVideo() {

    try {

        console.log("Loading video...");

        const response = await fetch(API_URL + "?t=" + Date.now(), {
            cache: "no-store"
        });

        if (!response.ok)
            throw new Error("HTTP " + response.status);

        const data = await response.json();

        if (!data.url)
            throw new Error("No video URL returned.");

        console.log("Video:", data.url);

        video.src = data.url;

        video.load();

    } catch (err) {

        console.error(err);

        retry();

    }

}

video.addEventListener("canplay", () => {

    video.play().catch(err => {

        console.error("Playback failed:", err);

        retry();

    });

});

video.addEventListener("error", () => {

    console.error("Video error");

    retry();

});

function retry() {

    if (retryCount >= MAX_RETRIES)
        return;

    retryCount++;

    console.log("Retry #" + retryCount);

    setTimeout(loadVideo, 2000);

}

loadVideo();

</script>


</body>
</html>
