<!DOCTYPE html>
<html>
<head>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

video {
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

</style>

</head>

<body>

<!-- VIDEO PLAYER -->
<video 
    id="background-video"
    autoplay
    muted
    loop
    playsinline>
</video>


<script>

const API_URL = 
"https://script.google.com/macros/s/AKfycbyhBuSjJFQn4zrVydoku9ycRvrHB_ePhehm5s2ItLHdHoXtgRTVY9LdnXnTvNPvfkqOqQ/exec";


const video = document.getElementById("background-video");


async function loadVideo(){

    try {

        const response = await fetch(API_URL);

        const videos = await response.json();


        console.log("Videos received:", videos);


        // Pick a random video
        const selectedVideo = 
            videos[Math.floor(Math.random() * videos.length)];


        console.log("Playing:", selectedVideo.url);


        video.src = selectedVideo.url;

        video.load();

        video.play();


    } catch(error) {

        console.error(
            "Failed to load video:",
            error
        );

    }

}


loadVideo();


</script>

    }

}


loadVideo();


</script>


</body>
</html>
