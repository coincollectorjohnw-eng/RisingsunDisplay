<!DOCTYPE html>
<html>
<head>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

video {
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

</style>

</head>

<body>

<!-- VIDEO PLAYER -->
<video 
    id="background-video"
    autoplay
    muted
    loop
    playsinline>
</video>


<script>

const API_URL = 
"https://script.google.com/macros/s/AKfycbyhBuSjJFQn4zrVydoku9ycRvrHB_ePhehm5s2ItLHdHoXtgRTVY9LdnXnTvNPvfkqOqQ/exec";


async function loadVideo(){

    try {

        const response = await fetch(API_URL);

        const data = await response.json();


        const video = document.getElementById(
            "background-video"
        );


        video.src = data.url;

        video.load();

        video.play();


    } catch(error) {

        console.error(
            "Failed to load video:",
            error
        );

    }

}


loadVideo();


</script>


</body>
</html>
